name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: 'SystemMate.sln'

jobs:
  # ── Unit Tests (headless, no WinUI) ──────────────────────────────────
  test:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore test project
        run: dotnet restore tests/SystemMate.Tests/SystemMate.Tests.csproj

      - name: Build test project
        run: dotnet build tests/SystemMate.Tests/SystemMate.Tests.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test tests/SystemMate.Tests/SystemMate.Tests.csproj -c Release --no-build --verbosity normal

  # ── Build WinUI App ───────────────────────────────────────────────────
  build:
    name: Build WinUI App
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore solution
        run: dotnet restore src/SystemMate/SystemMate.csproj

      - name: Build (Release, x64)
        run: >
          dotnet build src/SystemMate/SystemMate.csproj
          -c Release
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64
          --no-restore

      - name: Publish self-contained
        run: >
          dotnet publish src/SystemMate/SystemMate.csproj
          -c Release
          -p:Platform=x64
          -r win-x64
          --self-contained true
          -o artifacts/publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemMate-x64-Release
          path: artifacts/publish/
          retention-days: 14
