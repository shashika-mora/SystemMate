name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  # ── Unit Tests (headless, no WinUI) ──────────────────────────────────
  test:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore test project
        run: dotnet restore tests/SystemMate.Tests/SystemMate.Tests.csproj

      - name: Build test project
        run: dotnet build tests/SystemMate.Tests/SystemMate.Tests.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test tests/SystemMate.Tests/SystemMate.Tests.csproj -c Release --no-build --verbosity normal

  # ── Build WinUI App ───────────────────────────────────────────────────
  build:
    name: Build WinUI App
    runs-on: windows-2025
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      # Windows App SDK and SDK build tools are NuGet dependencies, not dotnet workloads.
      # Use Visual Studio MSBuild for the WinUI XAML compiler/tooling.
      - name: Build (Release, x64)
        run: >
          msbuild src/SystemMate/SystemMate.csproj
          /restore
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:WindowsAppSDKSelfContained=true

      - name: Publish self-contained
        run: >
          msbuild src/SystemMate/SystemMate.csproj
          /t:Publish
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:WindowsAppSDKSelfContained=true
          /p:PublishDir="${{ github.workspace }}/artifacts/publish/"

      - name: Verify published runtime dependencies
        shell: pwsh
        run: |
          $requiredFiles = 'SystemMate.exe', 'Microsoft.WinUI.dll', 'WinRT.Runtime.dll', 'Microsoft.UI.Xaml.dll', 'coreclr.dll', 'resources.pri'
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath "artifacts/publish/$file" -PathType Leaf)) {
              throw "Missing published runtime dependency: $file"
            }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemMate-x64-Release
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14
